<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Campus Connect — Your campus. Your people. Your next thing.</title>
  <meta name="description" content="Centralized campus club discovery, urgency deadline tracker, and credibility profiles." />
  
  <!-- Google Fonts: Plus Jakarta Sans & Caveat (Handwritten Mockup Accent) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with dark mode enabled -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            handwritten: ['"Caveat"', 'cursive'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              DEFAULT: '#0f172a',
              dark: '#090d16',
              light: '#f8fafc'
            },
            campus: {
              mint: '#ebf8f2',
              mintDark: '#1e4620',
              mintBorder: '#c3e8d6',
              pill: '#18181b',
              accent: '#6366f1'
            }
          }
        }
      }
    };
  </script>

  <!-- Theme Initializer (prevents flash of unstyled theme) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('cc_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>


  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.85em%22 font-size=%2280%22 font-weight=%22bold%22 fill=%22%23111%22>cc</text></svg>">
</head>
<body class="bg-[#F8F9FA] dark:bg-[#0A0D14] text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col font-sans selection:bg-slate-900 selection:text-white transition-colors duration-200 pb-20 md:pb-6">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Top Navbar Mount Point -->
  <div id="navbar-container"></div>

  <!-- Main View Container -->
  <main id="main-view" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5"></main>

  <!-- Mobile Bottom Navigation Bar (Shown on small screens) -->
  <div id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#0E131F]/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-6 py-2 flex items-center justify-around shadow-lg transition-colors"></div>

  <!-- Global Modal Mount Container -->
  <div id="modal-container"></div>

  <!-- App Entrypoint -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
